# PostgreSQL 16 OLTP reference config — UNB Wire (M15-SCALE-002)
# Worked example: 16 GB RAM / 8 vCPU dedicated DB server, SSD storage.
# Scale with the formulas; measure with pg_stat_statements before/after. See deploy/README.md.

# --- Memory ---
shared_buffers = 4GB              # 25% RAM (never > 40%)
effective_cache_size = 12GB        # ~75% RAM (planner hint)
work_mem = 32MB                   # conservative OLTP; formula: RAM * 0.25 / max_connections
maintenance_work_mem = 1GB
autovacuum_work_mem = 512MB
wal_buffers = 16MB
huge_pages = try

# --- Connections (behind PgBouncer transaction pools) ---
max_connections = 120             # active server conns stay ~25-30 per pooler; this is headroom for CLI/DDL/maintenance
superuser_reserved_connections = 3
idle_in_transaction_session_timeout = 60s

# --- Planner / IO (SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- WAL / checkpoints (bursty publish fan-out writes) ---
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# --- OLTP short queries don't pay JIT plan cost ---
jit = off

# --- Autovacuum (append-heavy: deliveries, downloads, notifications, audit_logs, story_events, index_outbox
#     carry per-table scale factor 0.02/0.01 via migration 2026_10_11_000300) ---
autovacuum_max_workers = 4
autovacuum_naptime = 15s

# --- Replication (feed reads ride the replica) ---
hot_standby_feedback = on
# Monitor replay_lag — publish->feed-visible SLO (60s) depends on it. Alert at > 5s.

# --- Observability ---
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 250ms
