; PgBouncer reference config — UNB Wire (M15-SCALE-002)
; Tune per server before applying — see deploy/README.md. Research basis: docs/research/scale-performance-optimization-research.md §4.5
;
; Deploy one PgBouncer per Postgres cluster (primary + replica each), point app DB_HOST/DB_READ_HOST at the pooler ports.
; PDO/PDO-prepared-statements caveat: until the app runs PHP 8.4 + libpq 17, Laravel must use emulated prepares
; against transaction pooling — add to config/database.php pgsql: 'options' => [PDO::ATTR_EMULATE_PREPARES => true]
; OR run the admin pool in session mode (only ~50 admins).

[databases]
; Write pool -> primary
unb_wire_write = host=127.0.0.1 port=5432 dbname=unb_wire
; Read pool -> replica
unb_wire_read = host=127.0.0.1 port=5433 dbname=unb_wire

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

; --- Pooling ---
pool_mode = transaction
; Formula: (DB vCPU x 2) + 1. Measure, don't guess.
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- Clients ---
; FPM workers + Horizon (10-16) + scheduler + Reverb + CLI headroom.
max_client_conn = 2000
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 10
client_idle_timeout = 60

; --- Protocol-level prepared statements (PgBouncer 1.21+) ---
max_prepared_statements = 200

; --- Auth ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- Ops ---
admin_users = postgres
stats_period = 60
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
