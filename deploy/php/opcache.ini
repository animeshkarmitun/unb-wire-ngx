; OPcache reference — UNB Wire (M15-SCALE-002)
; Production only. opcache.validate_timestamps=0 requires an FPM reload on every deploy
; (atomic symlink deploy -> systemctl reload php8.x-fpm).

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
; Count real project files (find . -name '*.php' | wc -l in vendor+app+config+routes+views) and headroom it.
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1         ; framework annotations rely on docblocks
