; PHP-FPM pool reference — UNB Wire (M15-SCALE-002)
; pm.max_children formula: (total RAM - reserved) / measured settled worker RSS.
; Measure settled RSS with: ps -ylC php-fpm --sort :rss  (Laravel workers settle 50-80MB bare, 120-180MB full monolith)
; Worked example: 8 vCPU / 16GB, ~2GB reserved (OS + nginx + Redis + OPcache) -> ~14GB / 120MB ~= 115 workers,
; capped at 2 x vCPU for CPU sanity; the surplus concurrency is what PgBouncer multiplexes.

[unb-wire]
user = www-data
group = www-data
listen = /run/php-fpm-unb.sock
listen.owner = www-data
listen.group = www-data

pm = static
pm.max_children = 16
pm.max_requests = 500             ; recycle leaking workers (500-1000 range)

; request_terminate_timeout must exceed slowest real request (Livewire updates, story renders)
request_terminate_timeout = 120s

; nginx side: fastcgi_read_timeout 40s; fastcgi_buffers 16 16k (Livewire payloads)
