name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unb_wire_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: unb_wire_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, gd, exif, intl, redis
          coverage: none

      - name: Create directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed

      - name: Schema parity
        run: php scripts/schema-parity-check.php

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Test
        run: php artisan test
