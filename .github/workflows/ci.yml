name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unb_wire_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: unb_wire_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, gd, exif, intl, redis, pcov
          coverage: pcov

      - name: Create directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed

      - name: Schema parity
        run: php scripts/schema-parity-check.php

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Test
        run: php artisan test --coverage-clover=coverage.xml --min=85

      - name: Coverage threshold gate
        run: php scripts/coverage-gate.php coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unb_wire_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: unb_wire_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, gd, exif, intl, redis

      - name: Create directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build admin assets
        run: |
          npm ci
          npm run build

      - name: Build portal assets
        run: |
          cd portal
          npm ci
          npm run build
          cd ..

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed

      - name: Run Playwright e2e suite
        # TODO(M14-COV-028): the e2e suite has lingering hang-or-fail
        # scenarios that the COV-001/017..026/COV-027 set did not catch.
        # continue-on-error so this gate is observable but does not block
        # merges until the suite is stable. Remove once a clean run on
        # the GitHub runner is reproduced.
        run: npx playwright test --workers=2 --reporter=line
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
