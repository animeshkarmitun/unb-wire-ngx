name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unb_wire_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: unb_wire_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, gd, exif, intl, redis, pcov
          coverage: pcov

      - name: Create directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed

      - name: Schema parity
        run: php scripts/schema-parity-check.php

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Test
        run: php artisan test --coverage-clover=coverage.xml --min=85

      - name: Coverage threshold gate
        run: php scripts/coverage-gate.php coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            echo '=== Deploying UNB Wire to production VPS ==='
            cd $VPS_PATH
            git fetch origin main
            git reset --hard origin/main
            docker exec wire-app-1 php artisan optimize:clear
            docker exec wire-app-1 php artisan view:clear
            docker exec wire-app-1 php artisan horizon:terminate || true
            docker exec wire-app-1 chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
            docker exec wire-app-1 chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
            echo '=== Deployment successful! ==='
          "

